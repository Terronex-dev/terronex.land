<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="That page is not on terronex.land. Return home or request a project estimate." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=tl2" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=tl2" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-dark-32.png?v=tl2" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-dark-16.png?v=tl2" media="(prefers-color-scheme: dark)" />

  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --charcoal: #15202B;
      --slate: #475569;
      --teal: #0F766E;
      --teal-soft: #CCFBF1;
      --snow: #F8FAFC;
      --white: #FFFFFF;
      --ink: #0F172A;
      --line: #E2E8F0;
      --radius: 8px;
      --max: 1080px;
      --nav-h: 84px;
      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: var(--sans);
      background: var(--snow);
      color: var(--ink);
      line-height: 1.6;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a { color: var(--teal); text-decoration: none; }
    a:hover { color: var(--charcoal); text-decoration: underline; }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 3px;
    }

    img { display: block; max-width: 100%; }

    .wrap {
      width: min(100% - 2rem, var(--max));
      margin-inline: auto;
    }

    .site-header {
      height: var(--nav-h);
      background: var(--charcoal);
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
    }
    .header-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      background: var(--snow);
      border-radius: var(--radius);
      padding: 0.2rem 0.55rem;
    }
    .brand:hover { text-decoration: none; opacity: 0.94; }
    .brand-logo {
      height: 56px;
      width: auto;
      max-width: min(340px, 68vw);
    }
    .header-link {
      color: var(--teal-soft);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
    }
    .header-link:hover { color: var(--white); text-decoration: none; }

    main {
      flex: 1;
      background: var(--charcoal);
      color: var(--snow);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 4.5rem 0;
    }
    .hero-plat {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background:
        radial-gradient(ellipse 50% 45% at 85% 15%, rgba(15, 118, 110, 0.35), transparent 55%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 39px,
          rgba(71, 85, 105, 0.45) 39px,
          rgba(71, 85, 105, 0.45) 40px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 39px,
          rgba(71, 85, 105, 0.45) 39px,
          rgba(71, 85, 105, 0.45) 40px
        );
    }
    .not-found {
      position: relative;
      max-width: 36rem;
    }
    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--teal-soft);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.85rem, 4.2vw, 2.65rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 0.85rem;
    }
    .lede {
      font-size: 1.125rem;
      color: #CBD5E1;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.25rem;
      border-radius: var(--radius);
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: var(--sans);
      text-decoration: none !important;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--teal);
      color: var(--white) !important;
    }
    .btn-primary:hover { filter: brightness(1.1); color: var(--white) !important; }
    .btn-ghost {
      background: transparent;
      color: var(--teal-soft) !important;
      border: 1px solid rgba(204, 251, 241, 0.35);
    }
    .btn-ghost:hover {
      background: rgba(204, 251, 241, 0.08);
      color: var(--white) !important;
      text-decoration: none;
    }

    footer {
      background: var(--ink);
      color: #94A3B8;
      padding: 1.75rem 0;
      font-size: 0.85rem;
    }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    footer a { color: #CBD5E1; }
    footer a:hover { color: var(--teal-soft); }
    .footer-brand {
      font-family: var(--serif);
      font-weight: 600;
      color: var(--white);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/"><img class="brand-logo" src="/assets/logo-header.png?v=8" width="380" height="64" alt="Terronex.land" /></a>
      <a class="header-link" href="/">Home</a>
    </div>
  </header>

  <main>
    <div class="hero-plat" aria-hidden="true"></div>
    <div class="wrap not-found">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p class="lede">That URL is not on terronex.land. Go home, or send a project estimate and we will follow up at hello@terronex.land.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Home</a>
        <a class="btn btn-ghost" href="/#estimate">Request estimate</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span class="footer-brand">Terronex LLC</span>
      <span>
        Lynchburg, VA
        · <a href="mailto:hello@terronex.land">hello@terronex.land</a>
        · <a href="/privacy.html">Privacy</a>
        · <a href="https://desk.terronex.land">Desk</a>
      </span>
    </div>
  </footer>

</html>
